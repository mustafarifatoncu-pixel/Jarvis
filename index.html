<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Jarvis</title>
<meta name="description" content="Sesli kişisel asistan">
<meta name="theme-color" content="#050a12">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<style>
:root {
  --bg: #050a12;
  --panel: #0a1520;
  --panel2: #0f1e2e;
  --line: #1a3550;
  --user: #12324a;
  --user-line: #21557a;
  --accent: #5ce1ff;
  --listen: #62f5b5;
  --think: #b79bff;
  --speak: #ffc15c;
  --bad: #ff8a8a;
  --text: #e2eef7;
  --muted: #8aa6bb;
  --font-display: "Barlow Semi Condensed", "Roboto Condensed", sans-serif-condensed, "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 640px; margin: 0 auto;
  padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}

/* Üst şerit */
.top { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 8px; }
.brand { font: 600 22px/1.1 var(--font-display); color: var(--accent); letter-spacing: .08em; }
.selam { color: var(--muted); font-size: 14px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { text-align: right; padding-right: 4px; }
.clock .saat { font: 500 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.clock .gun { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; color: var(--accent); padding: 0; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
.icon-btn[aria-pressed="true"] .off { display: none; }
.icon-btn[aria-pressed="false"] .on { display: none; }

/* Reaktör */
.orb { position: relative; flex: 0 0 auto; height: clamp(140px, 26vh, 250px); height: clamp(140px, 26dvh, 250px); cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.orb canvas { display: block; width: 100%; height: 100%; }
.durum { flex: 0 0 auto; margin-top: -4px; text-align: center; font: 500 14px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); transition: color .4s; }
.canli { flex: 0 0 auto; text-align: center; color: var(--text); font-size: 16px; padding: 6px 8px 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.canli:empty { display: none; }
.yaz .orb { height: 72px; }
.yaz .chips { display: none; }

/* Sohbet */
.log { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
.m { max-width: 88%; padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
.m.j { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-top-left-radius: 5px; }
.m.u { align-self: flex-end; background: var(--user); border: 1px solid var(--user-line); border-bottom-right-radius: 5px; }
.m.s { align-self: center; max-width: 94%; padding: 4px 8px; color: var(--muted); font-size: 14px; text-align: center; }
.m.s.bad { color: var(--bad); }
.m.l { align-self: stretch; max-width: 100%; white-space: normal; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.lnk { display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: #04141c; font-weight: 500; text-decoration: none; }
.kaynak { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.kaynak a { font-size: 13px; padding: 3px 10px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.help { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: 15px; }
.help dt { color: var(--accent); font-weight: 500; }
.help dd { margin: 0; color: var(--muted); }
.dots { display: inline-flex; gap: 5px; padding: 4px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--think); animation: nokta 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes nokta { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* Zamanlayıcılar */
.zam { flex: 0 0 auto; display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.zam::-webkit-scrollbar { display: none; }
.zam[hidden] { display: none; }
.zp { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 5px 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--panel); font-variant-numeric: tabular-nums; font-size: 14px; }
.zp b { font-weight: 500; color: var(--accent); }
.zp button { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: var(--panel2); color: var(--muted); line-height: 1; }

/* Hızlı komutlar */
.chips { flex: 0 0 auto; display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.chip:active { background: var(--panel2); }

/* Komut çubuğu */
.bar { flex: 0 0 auto; display: flex; gap: 8px; padding: 0 0 4px; align-items: center; }
.bar input { flex: 1 1 auto; min-width: 0; height: 50px; padding: 0 18px; border-radius: 25px; border: 1px solid var(--line); background: var(--panel2); font-size: 16px; }
.bar input::placeholder { color: var(--muted); }
.mic, .gonder { flex: 0 0 50px; width: 50px; height: 50px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); color: #04141c; display: grid; place-items: center; }
.mic[hidden], .gonder[hidden] { display: none; }
.mic.dinliyor { background: var(--listen); animation: halka 1.4s infinite; }
@keyframes halka { 0% { box-shadow: 0 0 0 0 rgba(98,245,181,.55); } 100% { box-shadow: 0 0 0 16px rgba(98,245,181,0); } }
.mic .dur { display: none; }
.mic.dinliyor .mik { display: none; }
.mic.dinliyor .dur { display: block; }

/* Ayarlar */
.sheet { position: fixed; inset: 0; z-index: 20; display: none; }
.sheet.acik { display: block; }
.perde { position: absolute; inset: 0; background: rgba(2, 6, 12, .75); }
.kart { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; width: min(100%, 640px); max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 16px max(16px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.kart-ust { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.kart h2 { margin: 0; font: 600 22px/1.2 var(--font-display); color: var(--accent); letter-spacing: .04em; }
.grup { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.grup h3 { margin: 0 0 8px; font: 600 16px/1.2 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.not { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.alan { display: grid; gap: 6px; margin-bottom: 12px; }
.alan > label, .alan > .etiket { font-size: 14px; color: var(--muted); }
.alan input[type="text"], .alan input[type="password"], .alan select { width: 100%; min-width: 0; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-size: 16px; }
.alan input[type="range"] { width: 100%; accent-color: var(--accent); }
.satir { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.satir > input, .satir > select { flex: 1 1 140px; }
.btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--accent); color: #04141c; font-weight: 500; }
.btn.sec { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
.btn.kucuk { min-height: 40px; padding: 0 14px; }
.btn:disabled { opacity: .5; }
.anahtar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.anahtar span { font-size: 16px; }
.anahtar small { display: block; color: var(--muted); font-size: 13px; }
.anahtar input { appearance: none; -webkit-appearance: none; flex: 0 0 auto; width: 48px; height: 28px; margin: 0; border-radius: 14px; border: 1px solid var(--line); background: var(--panel2); position: relative; cursor: pointer; }
.anahtar input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .2s; }
.anahtar input:checked { background: #0d3b4d; border-color: var(--accent); }
.anahtar input:checked::after { transform: translateX(20px); background: var(--accent); }
.sonuc { margin: 10px 0 0; font-size: 14px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.sonuc.ok { color: var(--listen); }
.sonuc.bad { color: var(--bad); }
.tani { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 40vh; overflow-y: auto; }
.tani:empty { display: none; }
details.gelismis summary { cursor: pointer; color: var(--muted); min-height: 36px; display: flex; align-items: center; }

@media (prefers-reduced-motion: reduce) {
  .dots i, .mic.dinliyor { animation: none; }
  .durum { transition: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <div class="brand">J.A.R.V.I.S</div>
      <div class="selam" id="selam"></div>
    </div>
    <div class="clock">
      <div class="saat" id="saat">--:--</div>
      <div class="gun" id="gun"></div>
    </div>
    <button type="button" class="icon-btn" id="sesBtn" aria-pressed="true" aria-label="Sesli cevap">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        <path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
        <path class="off" d="M17 9l5 6M22 9l-5 6"/>
      </svg>
    </button>
    <button type="button" class="icon-btn" id="ayarBtn" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </button>
  </header>

  <section class="orb" id="orbAlan" role="button" tabindex="0" aria-label="Konuşmak için dokunun">
    <canvas id="orb" aria-hidden="true"></canvas>
  </section>
  <div class="durum" id="durum" role="status">Hazır</div>
  <div class="canli" id="canli" aria-live="off"></div>

  <section class="log" id="log" role="log" aria-live="polite" aria-label="Sohbet"></section>

  <div class="zam" id="zam" hidden aria-label="Zamanlayıcılar"></div>
  <div class="chips" id="chips" aria-label="Hızlı komutlar"></div>

  <form class="bar" id="form" autocomplete="off">
    <input id="komut" type="text" inputmode="text" enterkeyhint="send" autocapitalize="sentences" autocomplete="off" spellcheck="false" placeholder="Yazın ya da mikrofona dokunun" aria-label="Komut">
    <button type="button" class="mic" id="micBtn" aria-label="Konuş">
      <svg class="mik" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="dur" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
    </button>
    <button type="submit" class="gonder" id="gonder" aria-label="Gönder" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</div>

<div class="sheet" id="ayarSheet" role="dialog" aria-modal="true" aria-labelledby="ayarBaslik">
  <div class="perde" data-kapat></div>
  <div class="kart" id="ayarKart">
    <div class="kart-ust">
      <h2 id="ayarBaslik">Ayarlar</h2>
      <button type="button" class="btn sec kucuk" data-kapat>Kapat</button>
    </div>

    <section class="grup">
      <h3>Yapay zekâ ve doğal ses</h3>
      <p class="not">Sohbet ve doğal ses için ücretsiz bir Gemini anahtarı gerekir. <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Anahtarı buradan alın</a>, kopyalayın ve aşağıya yapıştırın. Anahtar yalnızca bu telefonda saklanır.</p>
      <div class="alan">
        <label for="a-key">Gemini API anahtarı</label>
        <div class="satir">
          <input id="a-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza ile başlar">
          <button type="button" class="btn sec kucuk" id="a-goster">Göster</button>
        </div>
      </div>
      <div class="satir">
        <button type="button" class="btn" id="a-test">Kaydet ve test et</button>
        <button type="button" class="btn sec" id="a-sil">Anahtarı sil</button>
      </div>
      <p class="sonuc" id="a-durum" role="status"></p>
    </section>

    <section class="grup">
      <h3>Ses</h3>
      <div class="alan">
        <label for="a-motor">Konuşma sesi</label>
        <select id="a-motor">
          <option value="otomatik">Doğal ses (Gemini); olmazsa telefon sesi</option>
          <option value="telefon">Yalnızca telefonun sesi (hızlı)</option>
        </select>
      </div>
      <div class="alan">
        <label for="a-ses">Gemini sesi</label>
        <div class="satir">
          <select id="a-ses"></select>
          <button type="button" class="btn sec kucuk" id="a-dene">Dene</button>
        </div>
      </div>
      <div class="alan">
        <label for="a-hiz">Telefon sesi hızı: <span id="a-hiz-d">1,0</span></label>
        <input id="a-hiz" type="range" min="0.7" max="1.4" step="0.05" value="1">
      </div>
      <label class="anahtar"><span>Eller serbest<small>Cevaptan sonra otomatik yeniden dinler</small></span><input id="a-serbest" type="checkbox"></label>
    </section>

    <section class="grup">
      <h3>Kişiselleştirme</h3>
      <div class="alan">
        <label for="a-hitap">Size nasıl hitap edeyim?</label>
        <input id="a-hitap" type="text" autocomplete="off" placeholder="Efendim">
      </div>
      <div class="alan">
        <label for="a-sehir">Varsayılan şehir (hava durumu için)</label>
        <input id="a-sehir" type="text" autocomplete="off" placeholder="Örneğin: İstanbul">
      </div>
    </section>

    <section class="grup">
      <h3>Uygulama</h3>
      <div class="satir">
        <button type="button" class="btn sec" id="a-yukle" hidden>Ana ekrana yükle</button>
        <button type="button" class="btn sec" id="a-bildirim">Bildirimlere izin ver</button>
        <button type="button" class="btn sec" id="a-tani">Sistem kontrolü</button>
      </div>
      <p class="sonuc" id="a-yukle-not"></p>
      <div class="tani" id="a-tani-sonuc" aria-live="polite"></div>
      <button type="button" class="btn sec kucuk" id="a-kopya" hidden style="margin-top:8px">Sonucu kopyala</button>

      <details class="gelismis" style="margin-top:12px">
        <summary>Gelişmiş</summary>
        <div class="alan" style="margin-top:8px">
          <label for="a-smodel">Sohbet modeli</label>
          <select id="a-smodel"></select>
        </div>
        <div class="alan">
          <label for="a-tmodel">Ses modeli</label>
          <select id="a-tmodel"></select>
        </div>
        <div class="satir">
          <button type="button" class="btn sec kucuk" id="a-guncelle">Uygulamayı yenile</button>
          <button type="button" class="btn sec kucuk" id="a-temizle">Tüm verileri sil</button>
        </div>
        <p class="not" style="margin-top:8px" id="a-surum"></p>
      </details>
    </section>
  </div>
</div>

<script>
(function () {
'use strict';

/* ======================================================================
   Jarvis — telefon uygulaması
   Bölümler: çekirdek · reaktör · ses · gemini · komutlar · ayarlar · başlangıç
   ====================================================================== */

var SURUM = '1.0';
var $ = function (id) { return document.getElementById(id); };
var AYLAR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
var GUNLER = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

/* ------------------------------------------------------------ yardımcılar */
function iki(n) { return (n < 10 ? '0' : '') + n; }
function norm(s) {
  return String(s == null ? '' : s).replace(/[‘’`´]/g, "'").replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase().replace(/\s+/g, ' ').trim();
}
// Türkçe harfleri sadeleştirir: eşleştirmeleri "saat kac", "hava nasil" gibi yazılışlardan da yakalar.
function fold(s) {
  return norm(s).replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ö/g, 'o').replace(/ü/g, 'u')
    .replace(/[âä]/g, 'a').replace(/[îï]/g, 'i').replace(/û/g, 'u').replace(/'/g, '');
}
function kelimeler(n) { return n.split(/[^a-z0-9]+/).filter(Boolean); }
function rastgele(a) { return a[Math.floor(Math.random() * a.length)]; }
function ilkBuyuk(s) { return s ? s.charAt(0).toLocaleUpperCase('tr-TR') + s.slice(1) : s; }
function lsOku(k, v) { try { var x = localStorage.getItem(k); return x == null ? v : JSON.parse(x); } catch (e) { return v; } }
function lsYaz(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsHam(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsHamYaz(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { /* depolama kapalı olabilir */ } }

    ['Kur (jsDelivr)', function () { return jget('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json', 9000).then(function (j) { if (!j.usd) throw new Error('boş'); }); }],
    ['Kur (yedek)', function () { return jget('https://open.er-api.com/v6/latest/USD', 9000).then(function (j) { if (!j.rates) throw new Error('boş'); }); }],
    ['Vikipedi', function () { return jget('https://tr.wikipedia.org/api/rest_v1/page/summary/Ankara', 9000).then(function (j) { if (!j.extract) throw new Error('boş'); }); }]
  ];
  for (var i = 0; i < testler.length; i++) {
    try { await testler[i][1](); yaz('✓ ' + testler[i][0]); } catch (e) { yaz('✗ ' + testler[i][0] + ': ' + e.message); }
  }
  if (!anahtar) yaz('· Gemini anahtarı yok');
  else {
    try {
      var l = await modelleriKesfet(true);
      yaz('✓ Gemini: ' + l.toplam + ' model');
      yaz('  sohbet: ' + (l.sohbet.slice(0, 4).join(', ') || '—'));
      yaz('  ses: ' + (l.ses.slice(0, 4).join(', ') || '—'));
    } catch (e) { yaz('✗ Gemini: ' + e.message); }
    if (gem.cfg.sohbetModel) yaz('  çalışan sohbet modeli: ' + gem.cfg.sohbetModel);
    if (gem.cfg.sesModel) yaz('  çalışan ses modeli: ' + gem.cfg.sesModel);
  }
  if (gunluk.length) { yaz('Son hatalar:'); gunluk.slice(-6).forEach(function (g2) { yaz('  ' + g2.tur + ' ' + (g2.s || '') + ' ' + g2.m); }); }
}

function ayarBagla() {
  document.querySelectorAll('[data-kapat]').forEach(function (e) { e.addEventListener('click', ayarKapat); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') ayarKapat(); });
  $('a-goster').addEventListener('click', function () {
    var k = $('a-key'), gizli = k.type === 'password';
    k.type = gizli ? 'text' : 'password'; $('a-goster').textContent = gizli ? 'Gizle' : 'Göster';
  });
  $('a-test').addEventListener('click', anahtarTest);
  $('a-sil').addEventListener('click', function () {
    anahtar = ''; lsHamYaz('jv.key', ''); $('a-key').value = ''; gem.liste = null; try { localStorage.removeItem('jv.modeller'); } catch (e) { /* önemsiz */ }
    durumYaz($('a-durum'), 'Anahtar silindi.', '');
  });
  $('a-motor').addEventListener('change', function (e) { ayar.motor = e.target.value; ayarKaydet(); });
  $('a-ses').addEventListener('change', function (e) { ayar.sesAd = e.target.value; ayarKaydet(); });
  $('a-dene').addEventListener('click', function () {
    sesHazirla(); ses.soguma = 0;
    ayar.sesAd = $('a-ses').value; ayarKaydet();
    konus('Merhaba, ben Jarvis. Sesimi beğendiniz mi?', { zorla: true });
  });
  $('a-hiz').addEventListener('input', function (e) { ayar.hiz = parseFloat(e.target.value); $('a-hiz-d').textContent = fmt(ayar.hiz, 2); ayarKaydet(); });
  $('a-serbest').addEventListener('change', function (e) { ayar.serbest = e.target.checked; ayarKaydet(); wakeGuncelle(); });
  $('a-hitap').addEventListener('change', function (e) { ayar.hitap = e.target.value.trim(); ayarKaydet(); selamGuncelle(); });
  $('a-sehir').addEventListener('change', function (e) { ayar.sehir = e.target.value.trim(); ayarKaydet(); });
  $('a-smodel').addEventListener('change', function (e) { ayar.sohbetModel = e.target.value; ayarKaydet(); });
  $('a-tmodel').addEventListener('change', function (e) { ayar.sesModel = e.target.value; ayarKaydet(); });
  $('a-tani').addEventListener('click', function () { $('a-tani-sonuc').textContent = ''; tanilama(); });
  $('a-kopya').addEventListener('click', function () {
    var t = $('a-tani-sonuc').textContent;
    try { navigator.clipboard.writeText(t).then(function () { $('a-kopya').textContent = 'Kopyalandı'; }); } catch (e) { /* önemsiz */ }
  });
  $('a-bildirim').addEventListener('click', function () {
    if (!window.Notification) { $('a-yukle-not').textContent = 'Bu tarayıcı bildirimleri desteklemiyor.'; return; }
    Notification.requestPermission().then(function (p) { $('a-yukle-not').textContent = p === 'granted' ? 'Bildirimlere izin verildi.' : 'Bildirim izni verilmedi.'; });
  });
  $('a-yukle').addEventListener('click', function () {
    if (!kurulumOlayi) return;
    kurulumOlayi.prompt();
    kurulumOlayi.userChoice.then(function () { kurulumOlayi = null; $('a-yukle').hidden = true; });
  });
  $('a-guncelle').addEventListener('click', async function () {
    try {
      var regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
      for (var i = 0; i < regs.length; i++) await regs[i].unregister();
      if (window.caches) { var ks = await caches.keys(); for (var j = 0; j < ks.length; j++) await caches.delete(ks[j]); }
    } catch (e) { /* önemsiz */ }
    location.reload();
  });
  $('a-temizle').addEventListener('click', function () {
    if (!confirm('Anahtar, ayarlar, notlar ve zamanlayıcılar silinsin mi?')) return;
    try { Object.keys(localStorage).filter(function (k) { return k.indexOf('jv.') === 0; }).forEach(function (k) { localStorage.removeItem(k); }); } catch (e) { /* önemsiz */ }
    location.reload();
  });
}

var sonDakika = '';
function selamGuncelle() { $('selam').textContent = selam() + sonek() + '.'; }
function saatGuncelle() {
  var s = new Date(), dk = iki(s.getHours()) + ':' + iki(s.getMinutes());
  if (dk === sonDakika) return;
  sonDakika = dk;
  $('saat').textContent = dk;
  $('gun').textContent = s.getDate() + ' ' + AYLAR[s.getMonth()] + ', ' + GUNLER[s.getDay()];
  selamGuncelle();
}

function baslat() {
  // sesli cevap düğmesi
  var sesGuncelle = function () { sesBtn.setAttribute('aria-pressed', ayar.sesAcik ? 'true' : 'false'); };
  sesGuncelle();
  sesBtn.addEventListener('click', function () {
    ayar.sesAcik = !ayar.sesAcik; ayarKaydet(); sesGuncelle();
    if (!ayar.sesAcik) sesiDurdur();
  });
  $('ayarBtn').addEventListener('click', ayarAc);
  ayarBagla();

  // reaktör ve mikrofon
  orbAlan.addEventListener('click', orbTik);
  orbAlan.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); orbTik(); } });
  micBtn.addEventListener('click', orbTik);
  document.addEventListener('pointerdown', sesHazirla, { capture: true, once: true });

  // yazma çubuğu
  form.addEventListener('submit', function (e) { e.preventDefault(); gonder(inp.value, 'yazi'); inp.focus(); });
  inp.addEventListener('input', girdiDegisti);
  inp.addEventListener('focus', function () { appEl.classList.add('yaz'); setTimeout(function () { alta(true); }, 250); });
  inp.addEventListener('blur', function () { appEl.classList.remove('yaz'); });
  gonderBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); });   // klavye kapanıp düğme kaymasın
  girdiDegisti();

  // hızlı komutlar
  ['Saat kaç', 'Hava nasıl', 'Dolar kaç', 'Notlarım', 'Şaka yap', 'Yardım'].forEach(function (ad) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = ad;
    b.addEventListener('click', function () { gonder(ad, 'yazi'); });
    $('chips').appendChild(b);
  });

  // saat, zamanlayıcılar
  saatGuncelle();
  setInterval(function () { saatGuncelle(); zamKontrol(); }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) zamKontrol(); });
  zamCiz();
  wakeGuncelle();
  if (window.speechSynthesis) { try { window.speechSynthesis.getVoices(); } catch (e) { /* önemsiz */ } }

  // açılış
  setDurum('hazir');
  ekle('j', 'Sistemler çevrimiçi. Hoş geldiniz' + sonek() + '.');
  if (!SR) ekle('s', 'Bu tarayıcı sesle komutu desteklemiyor; yazarak konuşabilirsiniz. Sesli kullanım için Chrome önerilir.');
  else ekle('s', 'Konuşmak için küreye ya da mikrofon düğmesine dokunun.');
  if (!anahtar) eylem('Sohbet ve doğal ses için ücretsiz bir Gemini anahtarı ekleyin. Anahtarsız da saat, hava, kur, sayaç ve not komutları çalışır.', 'Ayarları aç', ayarAc);

  if (/[?&]dinle=1/.test(location.search)) setTimeout(function () { dinleBaslat(false); }, 600);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* önemsiz */ }); });
  }
}
baslat();
})();
